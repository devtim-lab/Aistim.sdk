name: Release extension

# Setiap tag v* (mis. v3.0.1) membuat Release berisi zip extension.
# Bisa juga dijalankan manual: Actions -> Release extension -> Run workflow
# (tag v<versi manifest> dibuat otomatis).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Periksa versi manifest sama dengan tag
        run: |
          V=$(jq -r .version extension/manifest.json)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} tidak sama dengan versi manifest v$V" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Buat zip extension
        run: |
          cd extension
          zip -qr "../aistim-tool-extension-v${VERSION}.zip" .

      - name: Buat Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > catatan.md <<EOT
          Extension Chrome Aistim Tool v${VERSION}.

          Cara pasang manual:
          1. Unduh \`aistim-tool-extension-v${VERSION}.zip\` di bawah, lalu ekstrak ke satu folder.
          2. Buka \`chrome://extensions\`, aktifkan Developer mode.
          3. Pilih Load unpacked dan arahkan ke folder hasil ekstrak.
          4. Buka Detail extension, lalu aktifkan Izinkan skrip pengguna (Allow User Scripts).

          Update: unduh zip versi terbaru, ekstrak ke folder yang sama, lalu muat ulang extension.
          EOT
          sed -i 's/^          //' catatan.md
          gh release create "v${VERSION}" "aistim-tool-extension-v${VERSION}.zip" --target "${GITHUB_SHA}" \
            --title "Aistim Tool v${VERSION}" --notes-file catatan.md
