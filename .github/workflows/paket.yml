name: Bangun paket script per akun
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"   # jaring pengaman saja (upload akun & perubahan script sudah memicu langsung); tidak membangun ulang bila tidak berubah
  push:
    branches: [main]
    paths: ["extension/scripts/**", "tools/bangun-paket.mjs", "extension/paket.js"]
concurrency:
  group: paket
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/checkout@v4
        with:
          repository: devtim-lab/Auth
          path: auth
          token: ${{ secrets.AUTH_TOKEN }}
      - name: Bangun paket
        env:
          PAKET_SEED: ${{ secrets.PAKET_SEED }}
        run: node tools/bangun-paket.mjs auth
      - name: Commit ke Auth
        working-directory: auth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paket
          git diff --cached --quiet && { echo "tidak ada perubahan"; exit 0; }
          git commit -m "paket: perbarui paket script"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 3; done
